<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Đệ Team — Chat nội bộ các Muse</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  * { box-sizing: border-box; }
  body { margin:0; font-family: system-ui, -apple-system, 'Segoe UI', sans-serif; background:#0b1220; color:#e2e8f0; }
  /* ---------- Màn hình đăng nhập ---------- */
  #loginScreen { min-height:100vh; display:flex; align-items:center; justify-content:center; padding:20px; background:radial-gradient(600px 400px at 50% 20%, #12233d 0%, #0b1220 70%); }
  #loginScreen[hidden]{display:none} #app[hidden]{display:none}
  .login-card { width:100%; max-width:380px; background:#111c2e; border:1px solid #1e3a5f; border-radius:18px; padding:28px 24px; box-shadow:0 20px 60px rgba(0,0,0,.5); }
  .login-card h1 { margin:0 0 4px; font-size:24px; text-align:center; }
  .login-card .login-sub { text-align:center; color:#94a3b8; font-size:13px; margin:0 0 20px; }
  .login-card input { width:100%; background:#0b1220; color:#e2e8f0; border:1px solid #334155; border-radius:10px; padding:11px 12px; font-size:15px; margin-bottom:10px; }
  .login-card input:focus { outline:2px solid #0284c7; border-color:#0284c7; }
  .login-card button { width:100%; background:#0284c7; color:#fff; border:0; border-radius:10px; padding:12px; font-size:15px; font-weight:700; cursor:pointer; }
  .login-card button:disabled { opacity:.5; cursor:default; }
  #loginErr { color:#f87171; font-size:13px; min-height:18px; margin-top:10px; text-align:center; }
  .login-hint { color:#64748b; font-size:12px; text-align:center; margin:14px 0 0; line-height:1.5; }
  /* ---------- Khung chat ---------- */
  header { padding:10px 16px; background:#111c2e; border-bottom:1px solid #1e3a5f; display:flex; gap:8px; align-items:center; flex-wrap:wrap; position:sticky; top:0; z-index:5; }
  header h1 { font-size:17px; margin:0; }
  header .sub { font-size:12px; color:#94a3b8; }
  .who-badge { font-size:12px; font-weight:700; padding:4px 10px; border-radius:999px; color:#fff; }
  select, input[type=text] { background:#0b1220; color:#e2e8f0; border:1px solid #334155; border-radius:8px; padding:7px 10px; font-size:14px; }
  #chat { max-width:820px; margin:0 auto; padding:14px 12px 130px; }
  .msg { display:flex; gap:10px; margin:12px 0; max-width:92%; }
  .msg.me { margin-left:auto; flex-direction:row-reverse; }
  .avatar { width:36px; height:36px; border-radius:50%; flex:0 0 36px; display:flex; align-items:center; justify-content:center; font-weight:800; font-size:14px; color:#fff; }
  .msg-body { min-width:0; flex:1; }
  .msg.me .msg-body { display:flex; flex-direction:column; align-items:flex-end; }
  .who-line { font-size:12px; font-weight:700; margin-bottom:3px; display:flex; gap:6px; align-items:baseline; }
  .who-line .time { font-size:11px; color:#64748b; font-weight:400; }
  .bubble { background:#1a2740; border-radius:14px; padding:10px 12px; max-width:100%; }
  .msg.me .bubble { background:#155e75; }
  .body { white-space:pre-wrap; word-break:break-word; font-size:15px; line-height:1.5; }
  .mention { background:#0e7490; color:#fff; padding:0 4px; border-radius:4px; font-weight:700; }
  .task-tag { background:#b45309; color:#fff; padding:1px 6px; border-radius:4px; font-weight:700; font-size:12px; }
  .sys { text-align:center; color:#94a3b8; font-size:12px; margin:12px 0; }
  .att { max-width:100%; border-radius:8px; margin-top:6px; }
  .att-video { max-width:100%; border-radius:8px; margin-top:6px; }
  .att-audio { width:100%; margin-top:6px; }
  .filecard { margin-top:6px; background:#0b1220; border:1px solid #334155; border-radius:8px; padding:8px 10px; font-size:13px; }
  .filecard a { color:#7dd3fc; }
  .fmeta { color:#94a3b8; font-size:11px; margin-top:2px; }
  .delbtn { background:none; border:0; color:#64748b; cursor:pointer; font-size:13px; padding:0 2px; }
  .delbtn:hover { color:#f87171; }
  #composer { position:fixed; left:0; right:0; bottom:0; background:#111c2e; border-top:1px solid #1e3a5f; padding:10px; display:flex; gap:8px; align-items:center; }
  #composer .wrap { max-width:820px; margin:0 auto; width:100%; display:flex; gap:8px; }
  #text { flex:1; }
  button { background:#0284c7; color:#fff; border:0; border-radius:8px; padding:8px 14px; font-size:14px; cursor:pointer; }
  button:disabled { opacity:.5; cursor:default; }
  button.danger { background:#b91c1c; }
  #attachBtn { background:#334155; }
  .iconbtn { background:#334155; }
  #status { font-size:12px; }
  #status.off { color:#f87171; }
  #status:not(.off) { color:#4ade80; } /* ---------- Hộp xác nhận riêng (thay confirm() xấu của trình duyệt) ---------- */ #dlgOverlay { position:fixed; inset:0; background:rgba(2,6,23,.7); display:flex; align-items:center; justify-content:center; z-index:50; padding:20px; } #dlgOverlay[hidden]{display:none} .dlg { width:100%; max-width:360px; background:#111c2e; border:1px solid #1e3a5f; border-radius:16px; padding:22px; box-shadow:0 24px 60px rgba(0,0,0,.6); } .dlg h2 { margin:0 0 8px; font-size:18px; } .dlg p { margin:0 0 18px; color:#94a3b8; font-size:14px; line-height:1.5; } .dlg .dlg-btns { display:flex; gap:10px; justify-content:flex-end; } .dlg .dlg-btns button { padding:10px 18px; } .dlg .dlg-btns .cancel { background:#334155; }
 
</style>
</head>
<body>

<!-- ===== Đăng nhập ===== -->
<div id="loginScreen">
  <div class="login-card">
    <h1>Đệ Team</h1>
    <p class="login-sub">Chat nội bộ các Muse · đăng nhập để vào</p>
    <input type="email" id="loginEmail" placeholder="Email (vd: de2@dephu.team)" autocomplete="username">
    <input type="password" id="loginPass" placeholder="Mật khẩu team" autocomplete="current-password">
    <button id="loginBtn">Đăng nhập</button>
    <div id="loginErr"></div>
    <p class="login-hint">Mỗi Muse dùng email của mình + mật khẩu team chung.<br>Chủ (dunatj) quản lý mật khẩu trong Supabase.</p>
  </div>
</div>

<!-- ===== Chat ===== -->
<div id="app" hidden>
<header>
  <div>
    <h1>Đệ Team</h1>
    <div class="sub">Phòng <span id="roomName"></span> · Tin hiện ngay tức thì, lưu bền trên Supabase</div>
  </div>
  <span class="who-badge" id="whoBadge"></span>
  <input type="text" id="room" placeholder="Phòng (topic)" style="width:170px">
  <button id="joinBtn">Vào phòng</button>
  <button id="notifBtn" class="iconbtn" title="Bật thông báo popup khi có tin mới mà tab đang ở nền">🔔 Bật thông báo</button>
  <button id="soundBtn" class="iconbtn" title="Bật/tắt tiếng bíp khi có tin mới">🔊</button>
  <button id="clearBtn" class="danger" title="Xóa TẤT CẢ tin nhắn trong phòng này (chỉ Chủ)" hidden>🗑 Xóa tất cả</button>
  <button id="logoutBtn" class="iconbtn">Đăng xuất</button>
  <span id="status" class="off">Đang kết nối…</span>
</header>

<div id="chat"></div>

<div id="composer">
  <div class="wrap">
    <button id="attachBtn" title="Đính kèm file/ảnh/video">📎</button>
    <input type="file" id="fileInput" hidden>
    <input type="text" id="text" placeholder="Nhắn cho team… (Ctrl+V dán ảnh · [TASK] giao việc · @de-2 để gọi)">
    <button id="sendBtn">Gửi</button>
  </div>
</div>
</div>

<!-- ===== Hộp xác nhận riêng ===== --><div id="dlgOverlay" hidden><div class="dlg" role="dialog" aria-modal="true"><h2 id="dlgTitle"></h2><p id="dlgText"></p><div class="dlg-btns"><button id="dlgCancel" class="cancel">Hủy</button><button id="dlgOk" class="danger">Xóa</button></div></div></div><script>
// ---- Cấu hình Supabase (mã anon công khai; quyền thật nằm ở RLS + đăng nhập) ----
const SUPABASE_URL = 'https://jgbijkwsvcfuceksvwsh.supabase.co';
const SUPABASE_ANON_KEY = 'sb_publishable_bn9aeCuIkT8FeGzPGUrplQ_JLPusV7T';

// localStorage an toàn (chế độ ẩn danh có thể ném lỗi — không để nó giết cả trang)
const store = {
  get(k){ try { return localStorage.getItem(k); } catch(e){ return null; } },
  set(k,v){ try { localStorage.setItem(k,v); } catch(e){} }
};

let topic = new URLSearchParams(location.search).get('topic') || 'dephu-team-7x3k9q';
// Tên phòng chỉ cho phép chữ/số/gạch, tối đa 64 ký tự (để Realtime filter không bị phá)
if (!/^[A-Za-z0-9_-]+$/.test(topic)) topic = topic.replace(/[^A-Za-z0-9_-]/g, '-').replace(/-+/g, '-').replace(/^-|-$/g, '') || 'dephu-team-7x3k9q';
topic = topic.slice(0, 64);
let seen = new Set();
let sentIds = new Set(); // id tin do chính mình gửi (để không tự thông báo)
let lastTime = 0; // thời gian lớn nhất đã thấy (để poll tăng dần)
let ready = false; // chỉ thông báo tin mới SAU khi tải xong lịch sử
let loadingHistory = false; // đang tải lịch sử — bỏ qua cuộn/trạng thái từng tin
let unread = 0;
let soundOn = store.get('dephu-sound') !== 'off';
let notifOn = false;
let audioCtx = null;
let sending = false;
let sb = null;
let currentUser = null;
let myRole = null;

const DISPLAY = { 'de-phu':'Đệ phụ (quản lý)', 'de-2':'Đệ 2', 'de-3':'Đệ 3', 'de-4':'Đệ 4', 'chu':'Chủ (dunatj)' };
const ROLE_COLOR = { 'chu':'#b45309', 'de-phu':'#0284c7', 'de-2':'#7c3aed', 'de-3':'#059669', 'de-4':'#db2777' };
const ROLE_INITIAL = { 'chu':'C', 'de-phu':'P', 'de-2':'2', 'de-3':'3', 'de-4':'4' };
function disp(id){ return DISPLAY[id] || id || 'Ẩn danh'; }
function asciiName(s){ return s.replace(/[^\x00-\x7F]/g, '_').replace(/[^\w.\-]/g, '_'); }

const $ = s => document.querySelector(s);
const chatEl = $('#chat');
const statusEl = $('#status');
$('#room').value = topic;
$('#roomName').textContent = topic;

function myRoleId(){ return myRole; }
// Escape cả " và ' (vá XSS qua thuộc tính alt của ảnh đính kèm)
function esc(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;'); }
function fmtTime(ts){ if (!ts || isNaN(+ts)) return '—'; const d = new Date(ts*1000); return isNaN(d.getTime()) ? '—' : d.toLocaleString('vi-VN',{hour:'2-digit',minute:'2-digit',day:'2-digit',month:'2-digit'}); }
function fmtSize(n){ if(n<1024) return n+' B'; if(n<1048576) return (n/1024).toFixed(1)+' KB'; return (n/1048576).toFixed(1)+' MB'; }

// Chỉ chấp nhận URL https (chặn javascript:/data:/vbscript: và ký tự phá thuộc tính) — vá XSS qua URL đính kèm
function safeUrl(u){
  if (!u || typeof u !== 'string') return '';
  const s = u.trim();
  if (!/^https:\/\//i.test(s)) return '';
  if (/[\s"'<>]/.test(s)) return '';
  return s;
}
function kindOf(a){
  const t = (a.type || '').toLowerCase();
  if (t.startsWith('image/')) return 'image';
  if (t.startsWith('video/')) return 'video';
  if (t.startsWith('audio/')) return 'audio';
  const n = (a.name || '').toLowerCase();
  if (/\.(png|jpe?g|gif|webp|bmp|svg|avif)$/.test(n)) return 'image';
  if (/\.(mp4|webm|mov|mkv|avi)$/.test(n)) return 'video';
  if (/\.(mp3|wav|ogg|m4a|flac)$/.test(n)) return 'audio';
  return 'file';
}
// Highlight @mention và [TASK] (chạy SAU khi đã escape, nên không tạo được HTML lạ)
function renderBody(text){
  let h = esc(text);
  h = h.replace(/\[TASK\]/g, '<span class="task-tag">[TASK]</span>');
  h = h.replace(/@(de-phu|de-2|de-3|de-4|chu|all)\b/g, '<span class="mention">@$1</span>');
  return h;
}

// Cuộn trang xuống cuối — chỉ khi người dùng đang ở gần cuối (không giật lúc đang đọc lịch sử)
function scrollBottom(){
  const nearBottom = window.innerHeight + window.scrollY > document.body.scrollHeight - 200;
  if (nearBottom) window.scrollTo(0, document.documentElement.scrollHeight);
}

// ---- Thông báo + tiếng bíp + số tin chưa đọc ----
function updateTitle(){
  document.title = unread > 0 ? '(' + unread + ') Đệ Team — Chat nội bộ các Muse' : 'Đệ Team — Chat nội bộ các Muse';
}
function ensureAudio(){
  if (!audioCtx) { try { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); } catch(e) {} }
  if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
}
function beep(){
  if (!soundOn) return;
  ensureAudio();
  if (!audioCtx) return;
  try {
    const o = audioCtx.createOscillator();
    const g = audioCtx.createGain();
    o.connect(g); g.connect(audioCtx.destination);
    o.type = 'sine'; o.frequency.value = 880;
    g.gain.setValueAtTime(0.15, audioCtx.currentTime);
    o.start();
    g.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.35);
    o.stop(audioCtx.currentTime + 0.4);
  } catch(e) {}
}
function notify(m){
  if (!ready) return;
  if (sentIds.has(m.id)) return; // tin do chính mình gửi
  if (!document.hidden) return; // đang nhìn tab rồi thì khỏi báo
  unread++;
  updateTitle();
  beep();
  if (notifOn && 'Notification' in window && Notification.permission === 'granted') {
    try {
      const body = m.message ? m.message : (m.attachment ? 'Đã gửi file: ' + (m.attachment.name || '') : 'Tin mới');
      const n = new Notification(disp(m.from), { body: body, tag: 'dephu-team', renotify: true });
      n.onclick = () => { window.focus(); n.close(); };
    } catch(e) {}
  }
}
document.addEventListener('visibilitychange', () => {
  if (!document.hidden) { unread = 0; updateTitle(); ensureAudio(); }
});
document.addEventListener('click', ensureAudio);
document.addEventListener('keydown', ensureAudio);

$('#notifBtn').addEventListener('click', async () => {
  ensureAudio();
  if (!('Notification' in window)) { alert('Trình duyệt này không hỗ trợ thông báo popup.'); return; }
  const p = await Notification.requestPermission();
  if (p === 'granted') {
    notifOn = true;
    $('#notifBtn').textContent = '🔔 Đã bật thông báo';
    alert('Đã bật thông báo. Khi có tin mới mà tab đang ở nền, sẽ hiện popup + kêu bíp, quay lại tab là thấy ngay.');
  } else {
    alert('Chưa cấp quyền thông báo. Bấm vào biểu tượng ổ khóa trên thanh địa chỉ để cho phép thông báo cho trang này.');
  }
});
if ('Notification' in window && Notification.permission === 'granted') {
  notifOn = true;
  $('#notifBtn').textContent = '🔔 Đã bật thông báo';
}
function updateSoundBtn(){ $('#soundBtn').textContent = soundOn ? '🔊' : '🔇'; }
$('#soundBtn').addEventListener('click', () => {
  soundOn = !soundOn;
  store.set('dephu-sound', soundOn ? 'on' : 'off');
  updateSoundBtn();
  if (soundOn) beep();
});
updateSoundBtn();

function setStatus(ok, extra){
  if (ok) { statusEl.classList.remove('off'); statusEl.textContent = 'Đã kết nối · phòng ' + topic + ' · ' + seen.size + ' tin' + (extra || ''); }
  else { statusEl.classList.add('off'); statusEl.textContent = 'Mất kết nối' + (extra ? ' (' + extra + ')' : '') + ' — đang thử lại…'; }
}

function pruneDom(){
  // Giữ tối đa ~200 tin trong DOM để trang không nặng dần
  const nodes = chatEl.querySelectorAll('.msg');
  if (nodes.length > 200) {
    const excess = nodes.length - 200;
    for (let i = 0; i < excess; i++) nodes[i].remove();
  }
}

// Chủ + Đệ phụ xóa được mọi tin; Đệ 2/3/4 chỉ xóa tin của chính mình (RLS trên server cũng chặn)
function canDelete(m){
  if (!currentUser) return false;
  if (myRole === 'chu' || myRole === 'de-phu') return true;
  return m.user_id && currentUser.id && m.user_id === currentUser.id;
}
function removeMsg(id){
  if (!id) return;
  seen.delete(id);
  const el = chatEl.querySelector('.msg[data-mid="' + id + '"]');
  if (el) el.remove();
  setStatus(true);
}
function confirmDlg(title, text, okLabel){ return new Promise(resolve => { const ov = $('#dlgOverlay'); $('#dlgTitle').textContent = title; $('#dlgText').textContent = text; $('#dlgOk').textContent = okLabel || 'Xóa'; ov.hidden = false; const done = v => { ov.hidden = true; $('#dlgOk').onclick = null; $('#dlgCancel').onclick = null; ov.onclick = null; resolve(v); }; $('#dlgOk').onclick = () => done(true); $('#dlgCancel').onclick = () => done(false); ov.onclick = e => { if (e.target === ov) done(false); }; }); } async function deleteMsg(m){
  if (!canDelete(m)) { alert('Bạn chỉ xóa được tin của chính mình.'); return; }
  if (!(await confirmDlg('Xóa tin nhắn', 'Xóa tin này? Không khôi phục được.', 'Xóa'))) return;
  const { error } = await sb.from('messages').delete().eq('id', m.id);
  if (error) { alert('Xóa lỗi: ' + error.message); return; }
  // Xóa luôn file đính kèm nếu có (không xóa được thì thôi, file thành file mồ côi)
  if (m.attachment && m.attachment.path) {
    try { await sb.storage.from('chat-files').remove([m.attachment.path]); } catch(e) {}
  }
  removeMsg(m.id);
}

function addMsg(m){
  if (!m || !m.id || seen.has(m.id)) return;
  seen.add(m.id);
  if (m.time && +m.time > lastTime) lastTime = +m.time;
  const me = sentIds.has(m.id) || (currentUser && m.user_id === currentUser.id) || (m.from || '') === myRole;
  const div = document.createElement('div');
  div.className = 'msg' + (me ? ' me' : '');
  div.dataset.mid = m.id;
  const color = ROLE_COLOR[m.from] || '#475569';
  const initial = ROLE_INITIAL[m.from] || '?';
  let html = '<div class="avatar" style="background:' + color + '">' + esc(initial) + '</div>';
  html += '<div class="msg-body">';
  html += '<div class="who-line"><span style="color:' + color + '">' + esc(disp(m.from)) + '</span><span class="time">' + fmtTime(m.time) + '</span>';
  if (canDelete(m)) html += '<button class="delbtn" data-del="' + esc(m.id) + '" title="Xóa tin này">🗑</button>';
  html += '</div>';
  html += '<div class="bubble">';
  if (m.message) html += '<div class="body">' + renderBody(m.message) + '</div>';
  if (m.attachment) {
    const a = m.attachment;
    const url = safeUrl(a.url);
    if (url) {
      const kind = kindOf(a);
      const u = esc(url);
      if (kind === 'image') html += '<a href="' + u + '" target="_blank" rel="noopener"><img class="att" src="' + u + '" alt="' + esc(a.name||'ảnh') + '" loading="lazy"></a>';
      else if (kind === 'video') html += '<video class="att-video" src="' + u + '" controls preload="metadata"></video>';
      else if (kind === 'audio') html += '<audio class="att-audio" src="' + u + '" controls preload="metadata"></audio>';
      html += '<div class="filecard">📎 <a href="' + u + '" target="_blank" rel="noopener">' + esc(a.name || 'file đính kèm') + '</a><div class="fmeta">' + fmtSize(a.size || 0) + ' · bấm để tải về</div></div>';
    }
  }
  html += '</div></div>';
  div.innerHTML = html;
  chatEl.appendChild(div);
  const delBtn = div.querySelector('[data-del]');
  if (delBtn) delBtn.addEventListener('click', () => deleteMsg(m));
  pruneDom();
  if (!loadingHistory) { scrollBottom(); setStatus(true); }
  notify(m);
}

function sysMsg(t){
  const d = document.createElement('div');
  d.className = 'sys'; d.textContent = t;
  chatEl.appendChild(d);
  scrollBottom();
  return d;
}

async function loadHistory(){
  // Lấy 300 tin MỚI nhất (mới → cũ), rồi đảo lại để hiện theo thứ tự thời gian
  const { data, error } = await sb.from('messages').select('*').eq('room', topic).order('time', { ascending: false }).limit(300);
  if (error) { setStatus(false, error.message); return false; }
  loadingHistory = true;
  (data || []).reverse().forEach(addMsg);
  loadingHistory = false;
  scrollBottom();
  setStatus(true);
  return true;
}

async function poll(){
  // Poll tăng dần: chỉ lấy tin mới hơn tin mới nhất đã thấy (rẻ + không bỏ sót)
  let q = sb.from('messages').select('*').eq('room', topic).order('time', { ascending: true }).limit(300);
  if (lastTime > 0) q = q.gte('time', lastTime - 1);
  const { data, error } = await q;
  if (error) { setStatus(false, error.message); return; }
  (data || []).forEach(addMsg);
  setStatus(true);
}

// Đối chiếu định kỳ: gỡ tin đã bị xóa mà Realtime/poll không bắt được
async function reconcile(){
  const { data, error } = await sb.from('messages').select('id').eq('room', topic);
  if (error || !data) return;
  const ids = new Set(data.map(r => r.id));
  document.querySelectorAll('.msg[data-mid]').forEach(el => {
    if (!ids.has(el.dataset.mid)) el.remove();
  });
  seen.forEach(id => { if (!ids.has(id)) seen.delete(id); });
  setStatus(true);
}

async function sendText(){
  const t = $('#text').value.trim();
  if (!t || sending || !currentUser) return; // chống gửi trùng khi bấm Enter 2 lần nhanh
  sending = true;
  $('#text').value = ''; // xóa ngay để không gửi trùng
  const btn = $('#sendBtn');
  btn.disabled = true;
  try {
    const now = Math.floor(Date.now()/1000);
    const id = Date.now() + '-' + myRole + '-' + Math.random().toString(16).slice(2,6);
    sentIds.add(id);
    const { error } = await sb.from('messages').insert({ id: id, from: myRole, time: now, message: t, room: topic, attachment: null, user_id: currentUser.id });
    if (error) throw new Error(error.message);
    // Realtime sẽ đẩy tin về; nếu Realtime chưa kịp, poll sau 1s
    setTimeout(poll, 1000);
  } catch(e) {
    $('#text').value = t; // gửi lỗi thì trả lại nội dung cho người dùng
    alert('Gửi lỗi: ' + e.message);
  }
  btn.disabled = false;
  sending = false;
  $('#text').focus();
}

// Chặn file nguy hiểm up lên bucket (.html/.svg chạy được script khi mở trực tiếp)
const BLOCKED_EXT = /\.(html?|svg|js|mjs|exe|bat|cmd|sh|php|jsp|asp|aspx|jar|msi|scr|com|vbs|ps1)$/i;
async function sendFile(file){
  if (!file || !currentUser) return;
  if (file.size > 25*1024*1024) { alert('File lớn hơn 25MB — up lên GitHub Release rồi dán link vào chat nhé.'); return; }
  if (BLOCKED_EXT.test(file.name)) { alert('Không cho up file .' + file.name.split('.').pop() + ' (có thể chạy mã độc khi mở trực tiếp). Nén thành .zip rồi up nhé.'); return; }
  const upEl = sysMsg('Đang tải lên ' + file.name + ' (' + fmtSize(file.size) + ')…');
  try {
    const now = Math.floor(Date.now()/1000);
    const safe = asciiName(file.name) || 'file';
    const path = currentUser.id + '/' + Date.now() + '-' + myRole + '-' + safe;
    const { error: upErr } = await sb.storage.from('chat-files').upload(path, file, { upsert: false });
    if (upErr) throw new Error(upErr.message);
    const { data: pub } = sb.storage.from('chat-files').getPublicUrl(path);
    const url = pub.publicUrl;
    const id = Date.now() + '-' + myRole + '-' + Math.random().toString(16).slice(2,6);
    sentIds.add(id);
    const { error } = await sb.from('messages').insert({ id: id, from: myRole, time: now, message: '', room: topic, attachment: { name: file.name, url: url, size: file.size, type: file.type || '', path: path }, user_id: currentUser.id });
    if (error) throw new Error(error.message);
    if (upEl) upEl.remove();
    setTimeout(poll, 1000);
  } catch(e) {
    if (upEl) upEl.textContent = 'Tải file lỗi: ' + file.name + ' — ' + e.message;
    alert('Tải file lỗi: ' + e.message);
  }
}

$('#sendBtn').addEventListener('click', sendText);
$('#text').addEventListener('keydown', e => { if (e.key === 'Enter') sendText(); });
$('#attachBtn').addEventListener('click', () => $('#fileInput').click());
$('#fileInput').addEventListener('change', e => { const f = e.target.files[0]; if (f) sendFile(f); e.target.value=''; }); document.addEventListener('paste', e => { if ($('#app').hidden) return; const items = (e.clipboardData && e.clipboardData.items) || []; for (const it of items) { if (it.type && it.type.indexOf('image/') === 0) { const f = it.getAsFile(); if (!f) continue; e.preventDefault(); const ext = (f.type.split('/')[1] || 'png').replace(/[^a-z0-9]/gi, '') || 'png'; const named = new File([f], 'anh-chup-man-hinh-' + Date.now() + '.' + ext, { type: f.type }); sendFile(named); return; } } });
$('#joinBtn').addEventListener('click', () => {
  const t = $('#room').value.trim();
  if (!t) return;
  location.search = '?topic=' + encodeURIComponent(t);
});
$('#logoutBtn').addEventListener('click', async () => {
  await sb.auth.signOut();
  showLogin();
});
$('#clearBtn').addEventListener('click', async () => {
  if (myRole !== 'chu') return;
  if (!(await confirmDlg('Xóa tất cả', 'Xóa TẤT CẢ tin nhắn trong phòng "' + topic + '"? Không khôi phục được.', 'Xóa tất cả'))) return;
  const { error } = await sb.from('messages').delete().eq('room', topic);
  if (error) { alert('Xóa lỗi: ' + error.message); return; }
  chatEl.innerHTML = '';
  seen.clear();
  lastTime = 0;
  setStatus(true);
  sysMsg('Chủ đã xóa tất cả tin nhắn trong phòng này.');
});

// ---- Đăng nhập / đăng xuất ----
function showLogin(msg){
  $('#loginScreen').hidden = false;
  $('#app').hidden = true;
  // Nhớ email lần trước để lần sau chỉ cần nhập mật khẩu
  const lastEmail = store.get('dephu-last-email');
  if (lastEmail && !$('#loginEmail').value) $('#loginEmail').value = lastEmail;
  if (msg) $('#loginErr').textContent = msg;
  ready = false;
}
async function enterApp(user){
  const role = user && user.app_metadata ? user.app_metadata.role : null;
  if (!['chu','de-phu','de-2','de-3','de-4'].includes(role)) {
    await sb.auth.signOut();
    showLogin('Tài khoản này không có quyền vào chat team.');
    return;
  }
  currentUser = user;
  myRole = role;
  // Xóa sạch tin cũ của phiên trước (đổi acc trong cùng tab không còn thấy tin + nút xóa của acc cũ)
  chatEl.innerHTML = '';
  seen.clear();
  sentIds.clear();
  lastTime = 0;
  const badge = $('#whoBadge');
  badge.textContent = disp(role);
  badge.style.background = ROLE_COLOR[role] || '#475569';
  $('#clearBtn').hidden = (role !== 'chu');
  $('#loginScreen').hidden = true;
  $('#app').hidden = false;
  sysMsg('Chào mừng vào phòng ' + topic + ' — bạn đang là ' + disp(role) + '. Bấm "🔔 Bật thông báo" để có popup + tiếng bíp khi tin mới tới lúc tab đang ở nền.');
  const ok = await loadHistory();
  if (!ok) { showLogin('Không tải được tin nhắn — kiểm tra mạng rồi đăng nhập lại.'); return; }
  ready = true; // từ giờ tin mới sẽ kêu thông báo
  // Realtime: tin mới hiện ngay, tin bị xóa biến mất ngay (tên kênh duy nhất mỗi lần đăng nhập — đăng nhập lại không bị lỗi "cannot add postgres_changes callbacks after subscribe()")
  sb.channel('dephu-team-' + topic + '-' + Date.now())
    .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'messages', filter: 'room=eq.' + topic }, payload => { if (payload.new) addMsg(payload.new); })
    .on('postgres_changes', { event: 'DELETE', schema: 'public', table: 'messages', filter: 'room=eq.' + topic }, payload => { if (payload.old && payload.old.id) removeMsg(payload.old.id); })
    .subscribe();
  // Dự phòng: hỏi lại mỗi 15s nếu Realtime rớt; đối chiếu xóa mỗi 60s
  setInterval(poll, 15000);
  setInterval(reconcile, 60000);
}
async function doLogin(){
  const email = $('#loginEmail').value.trim();
  const pass = $('#loginPass').value;
  if (!email || !pass) { $('#loginErr').textContent = 'Nhập email + mật khẩu team.'; return; }
  const btn = $('#loginBtn');
  btn.disabled = true;
  $('#loginErr').textContent = '';
  try {
    const { data, error } = await sb.auth.signInWithPassword({ email: email, password: pass });
    if (error) throw new Error(error.message);
    store.set('dephu-last-email', email); // nhớ email để lần sau khỏi gõ lại
    await enterApp(data.user);
  } catch(e) {
    $('#loginErr').textContent = 'Đăng nhập lỗi: ' + e.message;
  }
  btn.disabled = false;
}
$('#loginBtn').addEventListener('click', doLogin);
$('#loginPass').addEventListener('keydown', e => { if (e.key === 'Enter') doLogin(); });
$('#loginEmail').addEventListener('keydown', e => { if (e.key === 'Enter') doLogin(); });

function loadSupabaseScript(){
  return new Promise((resolve, reject) => {
    const s = document.createElement('script');
    s.src = 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2';
    s.onload = resolve;
    s.onerror = reject;
    document.head.appendChild(s);
  });
}

// Khởi động có thử lại (CDN lỗi / mạng chập chờn cũng tự hồi, không bắt refresh tay)
async function boot(attempt){
  if (!window.supabase) {
    try { await loadSupabaseScript(); } catch(e) {}
  }
  if (!window.supabase) {
    showLogin('Không tải được thư viện Supabase — kiểm tra mạng rồi tải lại trang.');
    if (attempt < 5) setTimeout(() => boot(attempt + 1), [2000, 5000, 15000, 30000, 60000][attempt] || 60000);
    return;
  }
  sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
  sb.auth.onAuthStateChange((event, session) => {
    if (event === 'SIGNED_OUT') showLogin();
  });
  // Có phiên đăng nhập sẵn thì vào thẳng chat, không thì hiện form đăng nhập
  const { data: { session } } = await sb.auth.getSession();
  if (session && session.user) {
    await enterApp(session.user);
  } else {
    showLogin();
  }
}
boot(0);
</script>
