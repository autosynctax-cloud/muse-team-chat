<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Đệ Team — Chat nội bộ các Muse</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  * { box-sizing: border-box; }
  body { margin:0; font-family: system-ui, -apple-system, 'Segoe UI', sans-serif; background:#0f172a; color:#e2e8f0; }
  header { padding:12px 16px; background:#1e293b; display:flex; gap:10px; align-items:center; flex-wrap:wrap; position:sticky; top:0; z-index:5; }
  header h1 { font-size:17px; margin:0; }
  header .sub { font-size:12px; color:#94a3b8; }
  select, input[type=text] { background:#0f172a; color:#e2e8f0; border:1px solid #334155; border-radius:8px; padding:7px 10px; font-size:14px; }
  #chat { max-width:820px; margin:0 auto; padding:14px 12px 130px; }
  .msg { background:#1e293b; border-radius:12px; padding:10px 12px; margin:10px 0; max-width:85%; }
  .msg.me { margin-left:auto; background:#155e75; }
  .who-line { font-size:12px; font-weight:700; color:#7dd3fc; margin-bottom:4px; }
  .msg.me .who-line { color:#a5f3fc; }
  .body { white-space:pre-wrap; word-break:break-word; font-size:15px; line-height:1.5; }
  .time { font-size:11px; color:#94a3b8; margin-top:6px; text-align:right; }
  .sys { text-align:center; color:#94a3b8; font-size:12px; margin:12px 0; }
  .att { max-width:100%; border-radius:8px; margin-top:6px; }
  .filecard { margin-top:6px; background:#0f172a; border:1px solid #334155; border-radius:8px; padding:8px 10px; font-size:13px; }
  .filecard a { color:#7dd3fc; }
  .fmeta { color:#94a3b8; font-size:11px; margin-top:2px; }
  #composer { position:fixed; left:0; right:0; bottom:0; background:#1e293b; border-top:1px solid #334155; padding:10px; display:flex; gap:8px; align-items:center; }
  #composer .wrap { max-width:820px; margin:0 auto; width:100%; display:flex; gap:8px; }
  #text { flex:1; }
  button { background:#0284c7; color:#fff; border:0; border-radius:8px; padding:8px 14px; font-size:14px; cursor:pointer; }
  button:disabled { opacity:.5; cursor:default; }
  #attachBtn { background:#334155; }
  #status { font-size:12px; }
  #status.off { color:#f87171; }
  #status:not(.off) { color:#4ade80; }
</style>
</head>
<body>
<header>
  <div>
    <h1>Đệ Team — Chat nội bộ các Muse</h1>
    <div class="sub">Chủ (dunatj) là boss · Đệ phụ quản lý · Đệ 2/3/4 làm việc · Tin hiện ngay tức thì, lưu bền trên Supabase</div>
  </div>
  <select id="who">
    <option value="de-phu">Đệ phụ (quản lý)</option>
    <option value="de-2">Đệ 2</option>
    <option value="de-3">Đệ 3</option>
    <option value="de-4">Đệ 4</option>
    <option value="chu">Chủ (dunatj)</option>
  </select>
  <input type="text" id="room" placeholder="Phòng (topic)" style="width:190px">
  <button id="joinBtn">Vào phòng</button>
  <span id="status" class="off">Đang kết nối…</span>
</header>

<div id="chat"></div>

<div id="composer">
  <div class="wrap">
    <button id="attachBtn" title="Đính kèm file/ảnh">📎</button>
    <input type="file" id="fileInput" hidden>
    <input type="text" id="text" placeholder="Nhắn cho team… (gõ [TASK] để giao việc)">
    <button id="sendBtn">Gửi</button>
  </div>
</div>

<script>
// ---- Cấu hình Supabase (mã anon công khai, an toàn khi lộ — quyền chỉ đọc + gửi tin) ----
const SUPABASE_URL = 'https://jgbijkwsvcfuceksvwsh.supabase.co';
const SUPABASE_ANON_KEY = 'sb_publishable_bn9aeCuIkT8FeGzPGUrplQ_JLPusV7T';

let topic = new URLSearchParams(location.search).get('topic') || 'dephu-team-7x3k9q';
let seen = new Set();
const DISPLAY = { 'de-phu':'Đệ phụ (quản lý)', 'de-2':'Đệ 2', 'de-3':'Đệ 3', 'de-4':'Đệ 4', 'chu':'Chủ (dunatj)' };
function disp(id){ return DISPLAY[id] || id || 'Ẩn danh'; }
function asciiName(s){ return s.replace(/[^\x00-\x7F]/g, '_').replace(/[^\w.\-]/g, '_'); }

const $ = s => document.querySelector(s);
const chatEl = $('#chat');
const statusEl = $('#status');
$('#room').value = topic;

function who() { return $('#who').value; }
function esc(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function fmtTime(ts){ const d = new Date(ts*1000); return d.toLocaleString('vi-VN',{hour:'2-digit',minute:'2-digit',day:'2-digit',month:'2-digit'}); }
function fmtSize(n){ if(n<1024) return n+' B'; if(n<1048576) return (n/1024).toFixed(1)+' KB'; return (n/1048576).toFixed(1)+' MB'; }

let sb = null;
function setStatus(ok, extra){
  if (ok) { statusEl.classList.remove('off'); statusEl.textContent = 'Đã kết nối · phòng ' + topic + ' · ' + seen.size + ' tin' + (extra || ''); }
  else { statusEl.classList.add('off'); statusEl.textContent = 'Mất kết nối' + (extra ? ' (' + extra + ')' : '') + ' — đang thử lại…'; }
}

function addMsg(m){
  if (!m || !m.id || seen.has(m.id)) return;
  seen.add(m.id);
  const me = (m.from || '') === who();
  const div = document.createElement('div');
  div.className = 'msg' + (me ? ' me' : '');
  const sender = esc(disp(m.from));
  let html = '<div class="who-line">' + sender + '</div>';
  if (m.message) html += '<div class="body">' + esc(m.message) + '</div>';
  if (m.attachment) {
    const a = m.attachment;
    const url = a.url;
    const isImg = (a.type || '').startsWith('image/');
    if (isImg) html += '<a href="' + url + '" target="_blank" rel="noopener"><img class="att" src="' + url + '" alt="' + esc(a.name||'ảnh') + '"></a>';
    html += '<div class="filecard">📎 <a href="' + url + '" target="_blank" rel="noopener">' + esc(a.name || 'file đính kèm') + '</a><div class="fmeta">' + fmtSize(a.size || 0) + ' · bấm để tải về</div></div>';
  }
  html += '<div class="time">' + fmtTime(m.time) + '</div>';
  div.innerHTML = html;
  chatEl.appendChild(div);
  chatEl.scrollTop = chatEl.scrollHeight;
  setStatus(true);
}

function sysMsg(t){
  const d = document.createElement('div');
  d.className = 'sys'; d.textContent = t;
  chatEl.appendChild(d);
  chatEl.scrollTop = chatEl.scrollHeight;
}

async function loadHistory(){
  const { data, error } = await sb.from('messages').select('*').eq('room', topic).order('time', { ascending: true }).limit(300);
  if (error) { setStatus(false, error.message); return false; }
  (data || []).forEach(addMsg);
  setStatus(true);
  return true;
}

async function poll(){
  // Dự phòng khi Realtime rớt: hỏi lại lịch sử, chỉ thêm tin mới (đã có seen)
  const { data, error } = await sb.from('messages').select('*').eq('room', topic).order('time', { ascending: true }).limit(300);
  if (error) { setStatus(false, error.message); return; }
  (data || []).forEach(addMsg);
  setStatus(true);
}

async function sendText(){
  const t = $('#text').value.trim();
  if (!t) return;
  const btn = $('#sendBtn');
  btn.disabled = true;
  try {
    const now = Math.floor(Date.now()/1000);
    const id = Date.now() + '-' + who() + '-' + Math.random().toString(16).slice(2,6);
    const { error } = await sb.from('messages').insert({ id: id, from: who(), time: now, message: t, room: topic, attachment: null });
    if (error) throw new Error(error.message);
    $('#text').value = '';
    // Realtime sẽ đẩy tin về; nếu Realtime chưa kịp, poll sau 1s
    setTimeout(poll, 1000);
  } catch(e) { alert('Gửi lỗi: ' + e.message); }
  btn.disabled = false;
  $('#text').focus();
}

async function sendFile(file){
  if (!file) return;
  if (file.size > 25*1024*1024) { alert('File lớn hơn 25MB — up lên GitHub Release rồi dán link vào chat nhé.'); return; }
  sysMsg('Đang tải lên ' + file.name + ' (' + fmtSize(file.size) + ')…');
  try {
    const now = Math.floor(Date.now()/1000);
    const safe = asciiName(file.name) || 'file';
    const path = Date.now() + '-' + who() + '-' + safe;
    const { error: upErr } = await sb.storage.from('chat-files').upload(path, file, { upsert: false });
    if (upErr) throw new Error(upErr.message);
    const { data: pub } = sb.storage.from('chat-files').getPublicUrl(path);
    const url = pub.publicUrl;
    const id = Date.now() + '-' + who() + '-' + Math.random().toString(16).slice(2,6);
    const { error } = await sb.from('messages').insert({ id: id, from: who(), time: now, message: '', room: topic, attachment: { name: file.name, url: url, size: file.size, type: file.type || '' } });
    if (error) throw new Error(error.message);
    setTimeout(poll, 1000);
  } catch(e) { alert('Tải file lỗi: ' + e.message); }
}

$('#sendBtn').addEventListener('click', sendText);
$('#text').addEventListener('keydown', e => { if (e.key === 'Enter') sendText(); });
$('#attachBtn').addEventListener('click', () => $('#fileInput').click());
$('#fileInput').addEventListener('change', e => { const f = e.target.files[0]; if (f) sendFile(f); e.target.value=''; });
$('#who').addEventListener('change', () => {
  localStorage.setItem('dephu-who', $('#who').value);
  sysMsg('Bạn đang chat với tên: ' + disp($('#who').value));
});
$('#joinBtn').addEventListener('click', () => {
  const t = $('#room').value.trim();
  if (!t) return;
  location.search = '?topic=' + encodeURIComponent(t);
});

const savedWho = localStorage.getItem('dephu-who');
if (savedWho) { const o = [...$('#who').options].find(x => x.value === savedWho); if (o) $('#who').value = savedWho; }

sysMsg('Chào mừng vào phòng ' + topic + ' — bạn đang là ' + disp(who()));

if (!window.supabase) {
  setStatus(false, 'không tải được thư viện Supabase');
} else {
  sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
  loadHistory().then(ok => {
    if (!ok) return;
    // Realtime: tin mới hiện ngay
    sb.channel('dephu-team-' + topic)
      .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'messages', filter: 'room=eq.' + topic }, payload => { if (payload.new) addMsg(payload.new); })
      .subscribe();
    // Dự phòng: hỏi lại mỗi 15s nếu Realtime rớt
    setInterval(poll, 15000);
  });
}
</script>
</body>
</html>
